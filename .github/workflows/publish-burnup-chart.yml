name: Publish Status Pages to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/status/burnup_chart.html'
      - 'docs/status/report_card.html'
  workflow_dispatch:

jobs:
  publish:
    name: Copy burnup chart and report card to gh-pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout triggering branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Save status pages before workspace is replaced
        run: |
          cp docs/status/burnup_chart.html /tmp/burnup_chart.html
          cp docs/status/report_card.html /tmp/report_card.html

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages

      - name: Copy status pages
        run: |
          mkdir -p gh-pages/status
          cp /tmp/burnup_chart.html gh-pages/status/burnup_chart.html
          cp /tmp/report_card.html gh-pages/status/report_card.html

      - name: Commit and push to gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status/burnup_chart.html status/report_card.html
          git diff --cached --quiet || git commit -m "docs: update status pages"
          git push
